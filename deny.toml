# cargo-deny — an audit of the dependency tree.
# It runs in CI (`cargo deny check`): a vulnerable or wrongly licensed dependency
# must break the build rather than be discovered later. The tree is checked with
# every feature on, so the russh side, the large one, is in it.

[graph]
all-features = true

[advisories]
yanked = "deny"
# An unmaintained crate anywhere in the tree fails the check, not only a direct
# dependency: cargo-deny's own default covers the direct ones alone.
unmaintained = "all"
ignore = [
    # chrono is marked as unmaintained; the advisory reports no vulnerability. It
    # is in the lockfile through russh-util, which depends on it only on wasm32,
    # so no native build of this crate compiles it. The entry goes when russh no
    # longer brings chrono in.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability — a wasm32-only dependency of russh-util, not compiled in a native build" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# The aws-lc fence, the same trap rustls sets: russh's defaults pull in aws-lc-rs.
# We choose ring explicitly, and this turns a regression into a build failure.
deny = [{ name = "aws-lc-rs" }, { name = "aws-lc-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io and nothing else. Every dependency of this crate is public, krypto
# included, so there is no second registry to allow — and listing one anyway was
# not harmless. The private registry's URL sat in this file, which travels with
# the repo wherever it goes, and the allowance made it possible for a dependency
# to quietly come from there instead. This line is now the guard: name a private
# registry on any dependency and `cargo deny check` says so, in those words,
# instead of the build failing later with a type error about identical code.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
