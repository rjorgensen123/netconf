# Gitea Actions CI for netconf.
# It runs on every push to main, and on pull requests.
#
# PRECONDITION: a Gitea Actions runner must be registered.
#
# No private registry and no token. Every dependency is on crates.io, krypto
# included, and there are no path dependencies — so CI builds exactly what a
# consumer builds, and verifies on every push that the published krypto is what
# this crate compiles against. `.cargo/config.toml` names a registry for
# publishing only; nothing in a build reads it.
# The image is not pinned to a digest. It is the operating system the jobs run in;
# the Rust they use is the one the crate asks for, installed in each job. A pinned
# image would have to be moved by hand, and would pin nothing that matters here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      # Checkout without actions/checkout, which would be fetched from github.
      # Clone directly with the job token instead; rust:1-bookworm has git and
      # base64 already.
      - name: Checkout (in-house, no github)
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf '%s' "x-access-token:${{ github.token }}" | base64 -w0)
          git -c http.extraheader="Authorization: basic ${AUTH}" \
              fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      # The crate says which Rust it is built with: `rust-version` in Cargo.toml.
      # CI uses that one, in every job, and not whatever the image happens to hold,
      # so what is tested is what the crate asks for. The version is read, checked
      # for its form, installed, and checked again once it is the default.
      - name: Use the Rust the crate asks for
        run: |
          RUST=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "$RUST" | grep -Eqx '[0-9]+\.[0-9]+(\.[0-9]+)?'
          rustup toolchain install "$RUST" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST"
          case "$(rustc --version)" in
            "rustc $RUST "*|"rustc $RUST."*) ;;
            *) echo "the default is not Rust $RUST: $(rustc --version)"; exit 1 ;;
          esac

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      # `--all-targets` does not run doctests, and the doctests are where the
      # public surface is pinned (a `compile_fail` block proves that a match on
      # a `non_exhaustive` enum needs a wildcard arm). Run them on their own.
      - name: Doctests (skipped by --all-targets)
        run: cargo test --locked --doc

      # The russh transport is feature-gated, but it must always COMPILE, and the
      # parts that can be tested without a device — the TTL frame, the policy
      # refusal, the refusal to trust on first use — must always RUN. That catches
      # regressions with no hardware in the loop.
      - name: Test with russh-transport (the offline parts)
        run: cargo test --locked --all-targets --features russh-transport

      - name: Clippy with russh-transport (warnings are errors)
        run: cargo clippy --all-targets --locked --features russh-transport -- -D warnings

      # The documentation is built with warnings as errors: a broken link in a doc
      # comment is a wrong statement about the code.
      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  # The dependency audit: RustSec advisories, with the documented
  # RUSTSEC-2023-0071 exception (see deny.toml), the licence allowlist, the
  # aws-lc ban and the source check. `all-features` in deny.toml means the russh
  # tree is audited too.
  deny:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout (in-house, no github)
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf '%s' "x-access-token:${{ github.token }}" | base64 -w0)
          git -c http.extraheader="Authorization: basic ${AUTH}" \
              fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      # The crate says which Rust it is built with: `rust-version` in Cargo.toml.
      # CI uses that one, in every job, and not whatever the image happens to hold,
      # so what is tested is what the crate asks for. The version is read, checked
      # for its form, installed, and checked again once it is the default.
      - name: Use the Rust the crate asks for
        run: |
          RUST=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "$RUST" | grep -Eqx '[0-9]+\.[0-9]+(\.[0-9]+)?'
          rustup toolchain install "$RUST" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST"
          case "$(rustc --version)" in
            "rustc $RUST "*|"rustc $RUST."*) ;;
            *) echo "the default is not Rust $RUST: $(rustc --version)"; exit 1 ;;
          esac

      # The archive is checked against its SHA-256 before anything in it is run,
      # and what was installed is asked for its version afterwards.
      - name: Fetch cargo-deny
        run: |
          curl -sSfL -o /tmp/cd.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cd.tgz" | sha256sum -c -
          tar -xzf /tmp/cd.tgz -C /tmp --strip-components=1
          install /tmp/cargo-deny /usr/local/bin/
          test "$(cargo deny --version)" = "cargo-deny 0.20.2"

      - name: cargo deny check
        run: cargo deny check
